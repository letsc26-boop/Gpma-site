<title>GPMA — Gerência de Planejamento e Monitoramento das Ações em Saúde | APS Região Central</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #F7FAFE;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Palco com a proporção da arte (1536 x 1024 = 3:2) */
  .palco { position: relative; width: min(100vw, 150vh); aspect-ratio: 3 / 2; }
  .palco > img.fundo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; user-select: none; -webkit-user-drag: none;
  }

  /* Botões posicionados sobre o desenho (em % da imagem) */
  .hot {
    position: absolute; border: none; padding: 0; margin: 0;
    background: transparent; cursor: pointer; border-radius: 50%; outline: none;
    transition: transform .22s ease, box-shadow .22s ease, background-color .22s ease;
  }
  .hot:hover, .hot:focus-visible {
    transform: scale(1.04);
    background-color: rgba(255,255,255,0.10);
    box-shadow: 0 0 0 6px var(--anel), 0 10px 30px rgba(11,42,91,0.25);
  }
  .hot:active { transform: scale(0.98); }

  .hot.paineis    { left: 5.0%;  top: 5.0%;  width: 22.6%; height: 33.9%; --anel: rgba(30,111,217,.55); }
  .hot.custos     { left: 3.4%;  top: 49.0%; width: 21.6%; height: 32.4%; --anel: rgba(92,176,52,.55); }
  .hot.acs        { left: 72.6%; top: 5.6%;  width: 22.8%; height: 34.2%; --anel: rgba(240,196,25,.65); }
  .hot.territorio { left: 75.4%; top: 49.0%; width: 21.6%; height: 32.4%; --anel: rgba(232,72,85,.55); }
  .hot.conheca    { left: 30.3%; top: 81.0%; width: 39.5%; height: 12.6%; border-radius: 999px; --anel: rgba(30,111,217,.55); }

  /* Etiqueta ao passar o mouse */
  .hot .rotulo {
    position: absolute; left: 50%; transform: translate(-50%, 6px);
    white-space: nowrap; background: #0B2A5B; color: #fff;
    font-size: clamp(10px, 1.05vw, 14px); font-weight: 700; letter-spacing: .3px;
    padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .hot .rotulo.baixo { top: 100%; }
  .hot .rotulo.cima  { bottom: 100%; transform: translate(-50%, -6px); }
  .hot:hover .rotulo, .hot:focus-visible .rotulo { opacity: 1; transform: translate(-50%, 10px); }
  .hot:hover .rotulo.cima, .hot:focus-visible .rotulo.cima { transform: translate(-50%, -10px); }

  /* Aviso "Em breve" */
  .aviso {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #0B2A5B; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60;
  }
  .aviso.mostrar { opacity: 1; transform: translate(-50%, 0); }
</style>

  const LINKS = {
  "paineis": "Relatorio indicadores de saúde/Painel_GPMA_APS.html",
  "custos": "Painel NGC/inicio.html",
  "acs": "area do acs/Inicio_Area_ACS.html",
  "territorio": "territorializacao/Inicio_Territorializacao.html",

};

  let timerAviso;
  function irPara(chave, nome) {
    const destino = LINKS[chave];
    if (destino) {
      window.location.href = encodeURI(destino);
      return;
    }
    const el = document.getElementById('aviso');
    el.textContent = '🚧 ' + nome + ' — em breve!';
    el.classList.add('mostrar');
    clearTimeout(timerAviso);
    timerAviso = setTimeout(() => el.classList.remove('mostrar'), 2500);
  }
